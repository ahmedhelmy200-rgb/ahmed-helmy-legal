name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify docs folder exists
        run: |
          if [ ! -d "./docs" ]; then
            echo "❌ Error: docs folder not found!"
            echo "Please ensure the docs folder is present in the repository."
            exit 1
          fi
          echo "✅ docs folder verified"
          ls -la ./docs | head -20

      - name: Setup Node.js (optional - for future builds)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build static site (regenerate docs if needed)
        run: npm run build 2>/dev/null || echo "⚠️  Build script not found - using pre-built docs"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static docs folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
